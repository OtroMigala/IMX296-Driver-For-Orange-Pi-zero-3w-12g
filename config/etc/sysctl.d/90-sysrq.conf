# SysRq desde el teclado y la consola serie: solo sync (16). La imagen trae 176
# (/etc/sysctl.d/10-magic-sysrq.conf), que también permite reiniciar (b) y apagar (o). El kernel
# trae CONFIG_MAGIC_SYSRQ_SERIAL: por la consola serie, un BREAK (por ejemplo, cuando el adaptador
# USB-serie se desconecta o el PC lo suspende) seguido de un carácter cualquiera ejecuta esa orden.
# /proc/sysrq-trigger no depende de esta máscara: sigue sirviendo para pruebas como root.
kernel.sysrq = 16
