# Journal en la microSD, para leer con `journalctl -b -1` qué pasó antes de un panic, de un
# reinicio por watchdog o de un corte de energía.
#
# Requiere desactivar orangepi-ramlog (ENABLED=false en /etc/default/orangepi-ramlog): con ramlog,
# /var/log vive en una zram y solo se copia a la microSD una vez al día o al apagar limpio.
[Journal]
Storage=persistent
# La imagen trae 20M, pensado para la zram de 50 MB.
SystemMaxUse=200M
# Por defecto son 5 min: tras un panic se perderían justo los últimos minutos.
SyncIntervalSec=10s
