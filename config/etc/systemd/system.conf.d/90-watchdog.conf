# Watchdog por hardware de la A733 (driver sunxi-wdt): systemd le hace ping cada 8 s y, si el
# kernel o PID 1 se congelan sin llegar a un panic, el hardware reinicia la placa.
#
# 16 s es el máximo del hardware. Un valor mayor no sirve: el núcleo de watchdog lo rechaza con
# EINVAL y systemd 249 deja el watchdog armado (abrirlo lo arranca) sin hacerle ping nunca, lo que
# reinicia la placa a los 16 s de cada arranque.
[Manager]
RuntimeWatchdogSec=16s
# Apagado al reiniciar: con 16 s como máximo, el watchdog podría cortar a la mitad el sync final
# de un apagado lento (por ejemplo, después de copiar archivos grandes a la microSD).
RebootWatchdogSec=0
