# Paquete imx296-vin: vin_v4l2 busca el driver del sensor al cargarse, así que imx296_mipi tiene
# que estar antes. Con esto, "modprobe vin_v4l2" carga vin_io -> imx296_mipi -> vin_v4l2.
# No editar: se reemplaza al actualizar el paquete. Las opciones van en /etc/modprobe.d/imx296.conf.
softdep vin_v4l2 pre: imx296_mipi
