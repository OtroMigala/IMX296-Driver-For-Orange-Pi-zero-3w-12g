# Valores iniciales de los controles del sensor IMX296 (driver imx296_mipi). Se leen al cargar
# el módulo, en el arranque; para cambiarlos en vivo están los controles de /dev/v4l-subdevN
# (exposure, analogue_gain, horizontal_flip, vertical_flip...). Ver el README del driver.
#
#   rotation      180 (por defecto: espejo H+V, el sensor va montado invertido) o 0
#   exposure_us   exposición inicial en microsegundos (por defecto 10000)
#   gain_db10     ganancia analógica inicial en pasos de 0,1 dB, 0..480 (por defecto 0)
#   trigger_mode  0 = libre (por defecto), 1 = disparo externo por XTR (sin probar)
#
#options imx296_mipi rotation=180 exposure_us=10000 gain_db10=0
